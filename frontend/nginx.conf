# Note on add_header: a location block that declares its own add_header
# replaces ALL inherited ones, so the security set is repeated wherever a
# location adds caching headers.

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_types
  text/css
  text/plain
  application/javascript
  application/json
  image/svg+xml;

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # No CSP: the API origin is injected at runtime via config.js, so a
  # meaningful connect-src cannot be baked into the image.
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Vite emits content-hashed filenames under /assets — safe to cache forever.
  location /assets/ {
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # The entry document and runtime config must always revalidate, or clients
  # keep referencing hashed assets that no longer exist after a deploy.
  location = /index.html {
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "no-cache" always;
  }

  location = /config.js {
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
