# Note on add_header: a location block that declares its own add_header
# replaces ALL inherited ones, so the security set is repeated wherever a
# location adds caching headers.

# The API, through this same address. People sign the phone in with the
# address they know from the browser, and without this that address answered
# the sign-in with the web page itself — "Can't reach your server" on the
# phone while the server was fine. The upstream is a variable, resolved by
# Docker's DNS when a request arrives, so nginx starts even where the name
# does not exist; the container's start script substitutes API_UPSTREAM.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_types
  text/css
  text/plain
  application/javascript
  application/json
  image/svg+xml;

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # No CSP: the API origin is injected at runtime via config.js, so a
  # meaningful connect-src cannot be baked into the image.
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Vite emits content-hashed filenames under /assets — safe to cache forever.
  location /assets/ {
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # The entry document and runtime config must always revalidate, or clients
  # keep referencing hashed assets that no longer exist after a deploy.
  location = /index.html {
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "no-cache" always;
  }

  location = /config.js {
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache" always;
  }

  location /api/ {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api_upstream __API_UPSTREAM__;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The handoff socket rides on the same path.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # Streams and sockets are long-lived; buffering an audio stream through
    # nginx's disk is worse than none.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    proxy_request_buffering off;
    client_max_body_size 64m;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
