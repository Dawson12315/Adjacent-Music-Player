<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="1024" height="1024" role="img" aria-label="Adjacent">
  <rect width="32" height="32" rx="7.5" fill="#1964E3"/>

  <!-- The record. Near-black with a little blue in it: true black against the
       tile reads as a hole punched in the icon. Two grooves, not the half-dozen
       a real record has — at favicon size more rings read as moiré. -->
  <circle cx="16" cy="16" r="13.2" fill="#0B0E14"/>
  <circle cx="16" cy="16" r="11.6" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="0.14"/>
  <circle cx="16" cy="16" r="9.7" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="0.14"/>
  <circle cx="16" cy="16" r="13.2" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="0.2"/>

  <!-- Smaller than the duck standing alone, and centred on the record, so the
       grooves read around it rather than being covered by it. -->
  <g transform="translate(5.638 5.611) scale(0.66)">
    <!-- Tail, body and head overlap into one silhouette. -->
    <path d="M3.4 20.6 L1 17.4 L5.2 17.9 Z" fill="#FFC93C"/>
    <path d="M4 20.8c0-3.5 4-6 9-6s9 2.5 9 6-4 6-9 6-9-2.5-9-6Z" fill="#FFC93C"/>
    <circle cx="19.2" cy="12.4" r="5.9" fill="#FFC93C"/>
    <path d="M24.4 10.9 L30.4 12.6 L24.4 14.6 Z" fill="#FE8D09"/>
    <!-- The eye punches through to the record, not the tile. -->
    <circle cx="20.6" cy="11" r="1.25" fill="#0B0E14"/>
  </g>
</svg>
