services:
  backend:
    build:
      context: ./backend
    container_name: adjacent-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
      - ${MUSIC_LIBRARY_PATH_HOST}:/music:ro
    environment:
      - MUSIC_LIBRARY_PATH=/music
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN}
      - MUSICBRAINZ_EMAIL=${MUSICBRAINZ_EMAIL}
      # Required — the backend refuses to start with a missing or placeholder key.
      - AUTH_SECRET_KEY=${AUTH_SECRET_KEY}
      - APP_ENV=${APP_ENV:-production}
      - DEBUG=${DEBUG:-false}
      # Secure cookies break login on plain-HTTP LAN deployments (browsers
      # refuse to send them). Set true only when serving behind TLS.
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-false}
      # How long a device stays signed in after it last used Adjacent, in
      # minutes. Sessions renew while in use. Default 30 days.
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-43200}
      # Whose X-Forwarded-For the login rate limiter believes. The web
      # container forwards /api/ and sits at a fixed address on adjacent-net,
      # so by default it is the one trusted proxy: a phone signing in through
      # the web port is then seen as itself, not as the container. Behind a
      # reverse proxy add its address too, comma-separated. Never "*" on an
      # internet-exposed install.
      - FORWARDED_ALLOW_IPS=${FORWARDED_ALLOW_IPS:-172.28.0.3}
      # The zone scheduled jobs run in (the scan time in Settings, the
      # nightly backup). Containers are UTC unless told otherwise.
      - TZ=${TZ:-UTC}
      # Optional. When set, creating the first admin account requires this
      # value — closes the first-run land grab on a fresh public install.
      - SETUP_TOKEN=${SETUP_TOKEN:-}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/health/live"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks: [adjacent-net]

  # Optional — only needed for multi-user mode. Start it with:
  #   docker compose --profile postgres up -d
  # then point Settings → Server → Multi-user support at host "postgres".
  postgres:
    image: postgres:16-alpine
    container_name: adjacent-postgres
    profiles: ["postgres"]
    environment:
      - POSTGRES_DB=adjacent
      - POSTGRES_USER=adjacent
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # Rides inside the same data root as the rest of Adjacent, so existing
      # backup habits cover it.
      - ./backend/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adjacent -d adjacent"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks: [adjacent-net]

  frontend:
    build:
      context: ./frontend
    container_name: adjacent-frontend
    ports:
      - "5173:8080"
    environment:
      - API_BASE_URL=${API_BASE_URL}
      - TZ=${TZ:-UTC}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      adjacent-net:
        ipv4_address: 172.28.0.3

# One named network, so the reverse-proxy guides can join it by name and the
# web container keeps the address the backend trusts for forwarded headers.
networks:
  adjacent-net:
    name: adjacent-net
    ipam:
      config:
        - subnet: 172.28.0.0/24
