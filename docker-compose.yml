services:
  backend:
    build:
      context: ./backend
    container_name: adjacent-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
      - ${MUSIC_LIBRARY_PATH_HOST}:/music:ro
    environment:
      - MUSIC_LIBRARY_PATH=/music
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN}
      - MUSICBRAINZ_EMAIL=${MUSICBRAINZ_EMAIL}
      # Required — the backend refuses to start with a missing or placeholder key.
      - AUTH_SECRET_KEY=${AUTH_SECRET_KEY}
      - APP_ENV=${APP_ENV:-production}
      - DEBUG=${DEBUG:-false}
      # Secure cookies break login on plain-HTTP LAN deployments (browsers
      # refuse to send them). Set true only when serving behind TLS.
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-false}
      # Behind a reverse proxy, set this to the proxy's address so the login
      # rate limiter keys on real client IPs instead of the proxy's. Empty
      # (the default) means "trust nobody", which is correct for direct/LAN
      # access. Never set it to "*" on an internet-exposed install.
      - FORWARDED_ALLOW_IPS=${FORWARDED_ALLOW_IPS:-}
      # Optional. When set, creating the first admin account requires this
      # value — closes the first-run land grab on a fresh public install.
      - SETUP_TOKEN=${SETUP_TOKEN:-}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  # Optional — only needed for multi-user mode. Start it with:
  #   docker compose --profile postgres up -d
  # then point Settings → Server → Multi-user support at host "postgres".
  postgres:
    image: postgres:16-alpine
    container_name: adjacent-postgres
    profiles: ["postgres"]
    environment:
      - POSTGRES_DB=adjacent
      - POSTGRES_USER=adjacent
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # Rides inside the same data root as the rest of Adjacent, so existing
      # backup habits cover it.
      - ./backend/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adjacent -d adjacent"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: adjacent-frontend
    ports:
      - "5173:8080"
    environment:
      - API_BASE_URL=${API_BASE_URL}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
