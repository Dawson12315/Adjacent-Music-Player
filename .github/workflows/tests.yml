name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npx vitest run

      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # The suite runs once per engine: the SQLite default and a real Postgres.
    # Dialect drift between the two fails here before it can ship.
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: sqlite
            database_url: ""
          - database: postgres
            database_url: postgresql+psycopg://adjacent:adjacent@localhost:55432/adjacent

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: adjacent
          POSTGRES_USER: adjacent
          POSTGRES_PASSWORD: adjacent
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U adjacent -d adjacent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run suite (${{ matrix.database }})
        env:
          DATABASE_URL: ${{ matrix.database_url }}
        run: python -m pytest tests/ -q
